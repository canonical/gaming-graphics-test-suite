# Lint the shell scripts only.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in src/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck src/*.sh
